<section>
  <h1 class="mb-6 text-2xl font-bold">Popular movies</h1>

  @if (loading()) {
    <app-loading-spinner />
  } @else if (error(); as message) {
    <app-error-message [message]="message" (retry)="loadMovies()" />
  } @else if (movies().length === 0) {
    <p class="p-20 text-center text-gray-400">No movies found.</p>
  } @else {
    <ul class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
      @for (movie of movies(); track movie.id) {
        <li>
          <app-movie-card [movie]="movie" />
        </li>
      }
    </ul>
  }
</section>
