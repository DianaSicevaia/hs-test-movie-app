<section>
  <app-movie-search class="mb-6 block" [initialQuery]="query()" (queryChange)="onSearch($event)" />

  <h1 class="mb-6 truncate text-2xl font-bold">{{ heading() }}</h1>

  @if (error(); as code) {
    <app-error-message [message]="t().errors[code]" (retry)="loadMovies()" />
  } @else if (loading() && movies().length === 0) {
    <app-loading-spinner />
  } @else if (movies().length === 0) {
    <p class="p-20 text-center text-gray-400">
      @if (query()) {
        {{ t().list.emptyFor(query()) }}
      } @else {
        {{ t().list.empty }}
      }
    </p>
  } @else {
    <!-- While a new search is loading, keep the old results visible but dimmed to avoid flicker -->
    <ul
      class="grid grid-cols-1 gap-4 transition-opacity md:grid-cols-2 xl:grid-cols-3"
      [class.opacity-50]="loading()"
      [attr.aria-busy]="loading()"
    >
      @for (movie of movies(); track movie.id) {
        <li>
          <app-movie-card [movie]="movie" />
        </li>
      }
    </ul>
  }
</section>
