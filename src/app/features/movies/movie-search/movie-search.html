<form role="search" (submit)="onSubmit($event)" class="flex gap-2">
  <label for="movie-search" class="sr-only">Search movies</label>
  <input
    #searchInput
    id="movie-search"
    type="search"
    placeholder="Search movies…"
    autocomplete="off"
    [value]="query()"
    (input)="query.set(searchInput.value)"
    class="min-w-0 flex-1 rounded-md border border-gray-600 bg-gray-900 px-4 py-2 text-white placeholder:text-gray-500 focus:border-amber-600 focus:ring-1 focus:ring-amber-600 focus:outline-none"
  />
  <button
    type="submit"
    class="shrink-0 rounded-md bg-amber-600 px-5 py-2 font-medium text-white transition hover:bg-amber-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600"
  >
    Search
  </button>
</form>
