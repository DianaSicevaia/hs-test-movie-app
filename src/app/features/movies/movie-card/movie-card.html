<a
  appLongPress
  (longPress)="openOverview()"
  (click)="closeOverview()"
  [routerLink]="isOverviewOpen() ? null : ['/movie', movie().id]"
  [attr.data-open]="isOverviewOpen() || null"
  class="group flex h-full overflow-hidden rounded-lg bg-gray-900 shadow transition select-none [-webkit-touch-callout:none] hover:-translate-y-1 hover:shadow-xl focus-visible:outline-2 focus-visible:outline-amber-600"
>
  <div class="aspect-2/3 w-28 shrink-0 self-start overflow-hidden bg-gray-700 sm:w-36">
    @if (posterUrl(); as src) {
      <img
        [src]="src"
        [alt]="movie().title"
        loading="lazy"
        draggable="false"
        class="h-full w-full object-cover transition group-hover:scale-105"
      />
    } @else {
      <div class="flex h-full items-center justify-center p-2 text-center text-xs text-gray-400">
        No poster
      </div>
    }
  </div>

  <div class="relative flex min-w-0 flex-1 flex-col p-4">
    <h3
      class="line-clamp-2 text-lg leading-snug font-semibold text-white group-hover:text-amber-500"
      [title]="movie().title"
    >
      {{ movie().title }}
    </h3>

    <div class="mt-1 flex items-center gap-3 text-sm text-gray-400">
      <span>{{ releaseYear() }}</span>
      <span class="text-amber-500">★ {{ movie().vote_average | number: '1.1-1' }}</span>
    </div>

    @if (movie().overview) {
      <p class="mt-3 line-clamp-4 text-sm leading-relaxed text-gray-300 sm:line-clamp-5">
        {{ movie().overview }}
      </p>

      <!-- Full overview: shown on hover (mouse), keyboard focus or long press (touch) for better UI experience -->
      <div
        aria-hidden="true"
        class="pointer-events-none absolute inset-0 overflow-y-auto bg-gray-900/95 p-4 opacity-0 transition-opacity duration-200 group-hover:pointer-events-auto group-hover:opacity-100 group-focus-visible:opacity-100 group-data-open:pointer-events-auto group-data-open:opacity-100"
      >
        <p class="mb-2 font-semibold text-amber-500">{{ movie().title }}</p>
        <p class="text-sm leading-relaxed text-gray-200">{{ movie().overview }}</p>
      </div>
    } @else {
      <p class="mt-3 text-sm text-gray-500 italic">No description available.</p>
    }
  </div>
</a>
