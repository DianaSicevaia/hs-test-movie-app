<a
  [routerLink]="['/movie', movie().id]"
  class="group flex h-full flex-col overflow-hidden rounded-lg bg-gray-900 shadow transition hover:-translate-y-1 hover:shadow-xl focus-visible:outline-2 focus-visible:outline-amber-600"
>
  <div class="aspect-2/3 overflow-hidden bg-gray-700">
    @if (posterUrl(); as src) {
      <img
        [src]="src"
        [alt]="movie().title"
        loading="lazy"
        class="h-full w-full object-cover transition group-hover:scale-105"
      />
    } @else {
      <div class="flex h-full items-center justify-center p-4 text-center text-sm text-gray-400">
        No poster
      </div>
    }
  </div>

  <div class="flex flex-1 flex-col p-3">
    <h3 class="line-clamp-2 min-h-12 font-semibold text-white" [title]="movie().title">
      {{ movie().title }}
    </h3>

    <div class="mt-auto flex items-center justify-between pt-3 text-sm text-gray-400">
      <span>{{ releaseYear() }}</span>
      <span class="text-amber-500"> ★ {{ movie().vote_average | number: '1.1-1' }} </span>
    </div>
  </div>
</a>
